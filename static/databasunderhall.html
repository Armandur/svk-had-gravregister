<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Databasunderhåll – Gravregister</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .dbuh-sida { max-width: 95rem; margin: 2rem auto; padding: 2rem; }
    .dbuh-sida h1 { font-size: 1.35rem; margin-bottom: 1rem; color: var(--accent, #2563eb); }
    .dbuh-meny { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.25rem; }
    .dbuh-meny a, .dbuh-meny button {
      display: block;
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1.05rem;
      text-align: center;
      text-decoration: none;
      color: #1e293b;
      background: var(--card, #fff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
      cursor: pointer;
    }
    .dbuh-meny a:hover, .dbuh-meny button:hover {
      background: #f8fafc;
      border-color: var(--accent, #2563eb);
      color: var(--accent, #2563eb);
    }
    .dbuh-meny a:focus, .dbuh-meny button:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .dbuh-meny button:disabled { opacity: 0.7; cursor: wait; }
    .dbuh-ovanliga-tecken-rad { margin: 0; padding: 0.5rem 0; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .dbuh-ovanliga-tecken-rad input { font-family: Consolas, "Courier New", monospace; padding: 0.35rem 0.5rem; }
    .dbuh-namn-siffror-komma-typ { margin: 0.5rem 0; padding: 0.5rem 1rem; border: 1px solid var(--border, #e2e8f0); border-radius: 6px; }
    .dbuh-namn-siffror-komma-typ .dbuh-legend { font-size: 0.9rem; padding: 0 0.25rem; }
    .dbuh-namn-siffror-komma-typ label { margin-right: 1rem; font-weight: normal; }
    .dbuh-tillbaka { margin-bottom: 1rem; }
    .dbuh-tillbaka a { color: var(--accent); text-decoration: none; }
    .dbuh-tillbaka a:hover { text-decoration: underline; }
    .dbuh-innehall { margin-top: 1.5rem; }
    .dbuh-tabell-wrap { overflow-x: auto; margin-top: 1rem; }
    .dbuh-tabell { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .dbuh-tabell th, .dbuh-tabell td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid var(--border, #e2e8f0); }
    .dbuh-tabell th { background: #f8fafc; font-weight: 600; color: #475569; white-space: nowrap; }
    .dbuh-tabell tbody tr:hover { background: #f8fafc; }
    .dbuh-tabell a { color: var(--accent); text-decoration: none; }
    .dbuh-tabell a:hover { text-decoration: underline; }
    .dbuh-problem-cell { max-width: 28rem; font-size: 0.9rem; line-height: 1.4; }
    .dbuh-mono { font-family: Consolas, "Courier New", monospace; font-size: 0.9rem; }
    .dbuh-varde { word-break: break-word; max-width: 20rem; }
    .dbuh-tom { color: #64748b; font-style: italic; margin-top: 1rem; }
    .dbuh-fel { color: #b91c1c; margin-top: 0.5rem; }
    .dbuh-info { font-size: 0.9rem; color: #64748b; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <main class="dbuh-sida">
    <h1>Databasunderhåll</h1>
    <p class="dbuh-tillbaka"><a href="/">← Tillbaka till menyn</a></p>
    <nav class="dbuh-meny" id="dbuh-meny" aria-label="Underhållsfunktioner">
      <button type="button" id="dbuh-btn-saknar-postnummer-ort">
        Gravplatser med gatuadress men utan postnummer/ort
      </button>
      <button type="button" id="dbuh-btn-ofodd-f">
        Datakvalitet: &quot;f&quot; utan punkt istället för &quot;f.&quot; (ofödd) i namn – innehavare, gravsatta, närmast anhöriga
      </button>
      <button type="button" id="dbuh-btn-ovanliga-tecken">
        Datakvalitet: Ovanliga tecken (= £ $ % &) i fält
      </button>
      <p class="dbuh-ovanliga-tecken-rad">
        <label for="dbuh-input-ovanliga-tecken">Tecken att söka efter:</label>
        <input type="text" id="dbuh-input-ovanliga-tecken" value="=£$%&" size="20" aria-label="Tecken att söka efter" />
      </p>
      <button type="button" id="dbuh-btn-namn-siffror-komma">
        Datakvalitet: Siffror eller kommatecken i namnfält
      </button>
      <fieldset class="dbuh-namn-siffror-komma-typ" aria-label="Visa resultat med">
        <legend class="dbuh-legend">Visa resultat med:</legend>
        <label><input type="radio" name="dbuh-namn-typ" value="bada" checked /> Båda (siffror och kommatecken)</label>
        <label><input type="radio" name="dbuh-namn-typ" value="komma" /> Endast kommatecken</label>
        <label><input type="radio" name="dbuh-namn-typ" value="siffror" /> Endast siffror</label>
      </fieldset>
      <button type="button" id="dbuh-btn-manga-punkter">
        Datakvalitet: Fält med ovanligt många punkter
      </button>
      <p class="dbuh-ovanliga-tecken-rad">
        <label for="dbuh-input-manga-punkter">Minst antal punkter:</label>
        <input type="number" id="dbuh-input-manga-punkter" value="5" min="1" max="999" size="4" aria-label="Minst antal punkter" />
      </p>
    </nav>
    <div class="dbuh-innehall" id="dbuh-innehall" hidden>
      <h2 id="dbuh-innehall-rubrik"></h2>
      <p class="dbuh-info" id="dbuh-innehall-info"></p>
      <div class="dbuh-tabell-wrap" id="dbuh-tabell-wrap" hidden>
        <table class="dbuh-tabell" id="dbuh-tabell" role="grid">
          <thead id="dbuh-thead"></thead>
          <tbody id="dbuh-tbody"></tbody>
        </table>
      </div>
      <p class="dbuh-tom" id="dbuh-tom" hidden>Inga gravplatser hittades.</p>
      <p class="dbuh-fel" id="dbuh-fel" hidden></p>
      <p class="dbuh-tillbaka" style="margin-top: 1rem;"><a href="#" id="dbuh-tillbaka-till-meny">← Tillbaka till menyn</a></p>
    </div>
  </main>
  <script src="/static/auth.js"></script>
  <script>
(function () {
  const API = '/api';
  const innehall = document.getElementById('dbuh-innehall');
  const meny = document.getElementById('dbuh-meny');
  const rubrik = document.getElementById('dbuh-innehall-rubrik');
  const info = document.getElementById('dbuh-innehall-info');
  const tabellWrap = document.getElementById('dbuh-tabell-wrap');
  const thead = document.getElementById('dbuh-thead');
  const tbody = document.getElementById('dbuh-tbody');
  const tomEl = document.getElementById('dbuh-tom');
  const felEl = document.getElementById('dbuh-fel');
  const tillbakaTillMeny = document.getElementById('dbuh-tillbaka-till-meny');

  function visaMeny() {
    innehall.hidden = true;
    meny.hidden = false;
  }

  function visaInnehall() {
    meny.hidden = true;
    innehall.hidden = false;
    felEl.hidden = true;
    tomEl.hidden = true;
  }

  function slugFromFullstandigt(fullstandigt) {
    const s = (fullstandigt || '').trim();
    return s ? encodeURIComponent(s) : '';
  }

  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s == null ? '' : String(s);
    return div.innerHTML;
  }

  function fetchDatakvalitet(endpoint, rubrikText, infoText, tomText, buildRow) {
    var endpointForButton = endpoint.split('?')[0];
    const btn = document.querySelector('[data-dbuh-endpoint="' + endpointForButton + '"]');
    if (btn) btn.disabled = true;
    visaInnehall();
    rubrik.textContent = rubrikText;
    info.textContent = infoText;
    tabellWrap.hidden = true;
    tomEl.hidden = true;

    fetch(API + endpoint, { credentials: 'include' })
      .then(function (res) {
        if (res.status === 401) {
          window.location.href = '/login?redirect=' + encodeURIComponent('/databasunderhall');
          return null;
        }
        if (res.status === 403) {
          throw new Error('Endast administratörer kan använda denna funktion.');
        }
        if (!res.ok) throw new Error('Kunde inte hämta data');
        return res.json();
      })
      .then(function (data) {
        if (btn) btn.disabled = false;
        if (!data) return;
        const lista = data.gravplatser || [];
        if (lista.length === 0) {
          tomEl.hidden = false;
          tomEl.textContent = tomText;
          return;
        }
        var headerHtml = buildRow(lista[0], true);
        thead.innerHTML = headerHtml;
        tbody.innerHTML = '';
        lista.forEach(function (gp) {
          var rowOrRows = buildRow(gp, false);
          var rowCells = Array.isArray(rowOrRows) ? rowOrRows : [rowOrRows];
          rowCells.forEach(function (cells) {
            var tr = document.createElement('tr');
            tr.innerHTML = cells;
            tbody.appendChild(tr);
          });
        });
        tabellWrap.hidden = false;
      })
      .catch(function (err) {
        if (btn) btn.disabled = false;
        felEl.textContent = err.message || 'Ett fel uppstod';
        felEl.hidden = false;
      });
  }

  document.getElementById('dbuh-btn-saknar-postnummer-ort').addEventListener('click', function () {
    this.setAttribute('data-dbuh-endpoint', '/admin/databasunderhall/gravplatser-saknar-postnummer-ort');
    fetchDatakvalitet(
      '/admin/databasunderhall/gravplatser-saknar-postnummer-ort',
      'Gravplatser med gatuadress men utan postnummer/ort',
      'Gravplatser där någon gravrättsinnehavare, gravsatt eller närmast anhörig har gatuadress men saknar postnummer och/eller postort. Klicka på gravplatsen för att gå till den och korrigera.',
      'Inga gravplatser med gatuadress utan postnummer/ort.',
      function (gp, isHeader) {
        if (isHeader) {
          return '<tr><th scope="col">Gravplats</th><th scope="col">Roll</th><th scope="col">Gatuadress</th><th scope="col">Postnummer</th><th scope="col">Postort</th><th scope="col">Senast ändrad</th><th scope="col">Senast ändrad av</th></tr>';
        }
        var slug = gp.url_slug || slugFromFullstandigt(gp.fullstandigt);
        var gravLink = slug
          ? '<a href="/gravplatser/' + escapeHtml(slug) + '">' + escapeHtml(gp.fullstandigt || '–') + '</a>'
          : escapeHtml(gp.fullstandigt || '–');
        var base = '<td>' + gravLink + '</td>';
        var problemRader = gp.problem_rader || [];
        if (problemRader.length === 0) {
          return [ base + '<td class="dbuh-mono"></td><td class="dbuh-mono"></td><td class="dbuh-mono"></td><td class="dbuh-mono"></td>' + cellSenastAndrad(gp) ];
        }
        return problemRader.map(function (rad) {
          return base + '<td class="dbuh-mono">' + escapeHtml(rad.roll) + '</td><td class="dbuh-mono dbuh-varde">' + escapeHtml(rad.gatuadress || '') + '</td><td class="dbuh-mono">' + escapeHtml(rad.postnummer || '') + '</td><td class="dbuh-mono">' + escapeHtml(rad.postort || '') + '</td>' + cellSenastAndrad(gp);
        });
      }
    );
  });

  function formateraProblemFalt(problemFalt) {
    if (!problemFalt || !Array.isArray(problemFalt) || problemFalt.length === 0) return '–';
    return problemFalt.map(function (p) {
      return escapeHtml(p.roll) + ': ' + escapeHtml(p.falt) + ' = «' + escapeHtml(p.varde || '') + '»';
    }).join('<br>');
  }

  function formateraSenastAndrad(isoDatetime) {
    if (!isoDatetime) return '–';
    try {
      var d = new Date(isoDatetime);
      if (isNaN(d.getTime())) return escapeHtml(isoDatetime);
      return d.toLocaleString('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
    } catch (e) {
      return escapeHtml(isoDatetime);
    }
  }

  function cellSenastAndrad(gp) {
    return '<td>' + formateraSenastAndrad(gp.last_edited_at) + '</td><td>' + escapeHtml(gp.last_edited_by_username || '') + '</td>';
  }

  document.getElementById('dbuh-btn-ofodd-f').addEventListener('click', function () {
    this.setAttribute('data-dbuh-endpoint', '/admin/databasunderhall/datakvalitet-ofodd-f');
    fetchDatakvalitet(
      '/admin/databasunderhall/datakvalitet-ofodd-f',
      'Datakvalitet: "f" utan punkt istället för "f." (ofödd)',
      'Gravplatser där förnamn eller efternamn innehåller ordet "f" utan punkt hos innehavare, gravsatta eller närmast anhörig (t.ex. "Eriksson f Larsson"). Det ska stå "f." för ofödd (t.ex. "Eriksson f. Larsson"). Klicka på gravplatsen för att korrigera.',
      'Inga gravplatser med "f" utan punkt i namn hittades.',
      function (gp, isHeader) {
        if (isHeader) {
          return '<tr><th scope="col">Gravplats</th><th scope="col">Roll</th><th scope="col">Fält</th><th scope="col">Värde</th><th scope="col">Senast ändrad</th><th scope="col">Senast ändrad av</th></tr>';
        }
        var slug = gp.url_slug || slugFromFullstandigt(gp.fullstandigt);
        var gravLink = slug
          ? '<a href="/gravplatser/' + escapeHtml(slug) + '">' + escapeHtml(gp.fullstandigt || '–') + '</a>'
          : escapeHtml(gp.fullstandigt || '–');
        var base = '<td>' + gravLink + '</td>';
        var problemFalt = gp.problem_falt || [];
        if (problemFalt.length === 0) {
          return [ base + '<td class="dbuh-mono"></td><td class="dbuh-mono"></td><td class="dbuh-mono"></td>' + cellSenastAndrad(gp) ];
        }
        return problemFalt.map(function (p) {
          return base + '<td class="dbuh-mono">' + escapeHtml(p.roll) + '</td><td class="dbuh-mono">' + escapeHtml(p.falt) + '</td><td class="dbuh-mono dbuh-varde">' + escapeHtml(p.varde || '') + '</td>' + cellSenastAndrad(gp);
        });
      }
    );
  });

  document.getElementById('dbuh-btn-ovanliga-tecken').addEventListener('click', function () {
    this.setAttribute('data-dbuh-endpoint', '/admin/databasunderhall/datakvalitet-ovanliga-tecken');
    var teckenInput = document.getElementById('dbuh-input-ovanliga-tecken');
    var tecken = teckenInput ? teckenInput.value : '=£$%&';
    var endpoint = '/admin/databasunderhall/datakvalitet-ovanliga-tecken?tecken=' + encodeURIComponent(tecken);
    fetchDatakvalitet(
      endpoint,
      'Datakvalitet: Ovanliga tecken',
      'Gravplatser där något textfält innehåller de angivna tecknen. Du kan ändra tecken i fältet "Tecken att söka efter" och köra sökningen igen. Klicka på gravplatsen för att granska och korrigera.',
      'Inga gravplatser med de angivna tecknen hittades.',
      function (gp, isHeader) {
        if (isHeader) {
          return '<tr><th scope="col">Gravplats</th><th scope="col">Roll</th><th scope="col">Fält</th><th scope="col">Värde</th><th scope="col">Senast ändrad</th><th scope="col">Senast ändrad av</th></tr>';
        }
        var slug = gp.url_slug || slugFromFullstandigt(gp.fullstandigt);
        var gravLink = slug
          ? '<a href="/gravplatser/' + escapeHtml(slug) + '">' + escapeHtml(gp.fullstandigt || '–') + '</a>'
          : escapeHtml(gp.fullstandigt || '–');
        var base = '<td>' + gravLink + '</td>';
        var problemFalt = gp.problem_falt || [];
        if (problemFalt.length === 0) {
          return [ base + '<td class="dbuh-mono"></td><td class="dbuh-mono"></td><td class="dbuh-mono"></td>' + cellSenastAndrad(gp) ];
        }
        return problemFalt.map(function (p) {
          return base + '<td class="dbuh-mono">' + escapeHtml(p.roll) + '</td><td class="dbuh-mono">' + escapeHtml(p.falt) + '</td><td class="dbuh-mono dbuh-varde">' + escapeHtml(p.varde || '') + '</td>' + cellSenastAndrad(gp);
        });
      }
    );
  });

  document.getElementById('dbuh-btn-namn-siffror-komma').addEventListener('click', function () {
    this.setAttribute('data-dbuh-endpoint', '/admin/databasunderhall/datakvalitet-namn-siffror-komma');
    var typRadios = document.querySelectorAll('input[name="dbuh-namn-typ"]:checked');
    var typ = (typRadios.length && typRadios[0].value) ? typRadios[0].value : 'bada';
    var endpoint = '/admin/databasunderhall/datakvalitet-namn-siffror-komma?typ=' + encodeURIComponent(typ);
    fetchDatakvalitet(
      endpoint,
      'Datakvalitet: Siffror eller kommatecken i namnfält',
      'Gravplatser där namnfält innehåller siffror och/eller kommatecken. Välj med radioknapparna om du vill visa endast kommatecken, endast siffror eller båda. Klicka på gravplatsen för att korrigera.',
      'Inga gravplatser med valt filter hittades.',
      function (gp, isHeader) {
        if (isHeader) {
          return '<tr><th scope="col">Gravplats</th><th scope="col">Roll</th><th scope="col">Fält</th><th scope="col">Värde</th><th scope="col">Senast ändrad</th><th scope="col">Senast ändrad av</th></tr>';
        }
        var slug = gp.url_slug || slugFromFullstandigt(gp.fullstandigt);
        var gravLink = slug
          ? '<a href="/gravplatser/' + escapeHtml(slug) + '">' + escapeHtml(gp.fullstandigt || '–') + '</a>'
          : escapeHtml(gp.fullstandigt || '–');
        var base = '<td>' + gravLink + '</td>';
        var problemFalt = gp.problem_falt || [];
        if (problemFalt.length === 0) {
          return [ base + '<td class="dbuh-mono"></td><td class="dbuh-mono"></td><td class="dbuh-mono"></td>' + cellSenastAndrad(gp) ];
        }
        return problemFalt.map(function (p) {
          return base + '<td class="dbuh-mono">' + escapeHtml(p.roll) + '</td><td class="dbuh-mono">' + escapeHtml(p.falt) + '</td><td class="dbuh-mono dbuh-varde">' + escapeHtml(p.varde || '') + '</td>' + cellSenastAndrad(gp);
        });
      }
    );
  });

  document.getElementById('dbuh-btn-manga-punkter').addEventListener('click', function () {
    this.setAttribute('data-dbuh-endpoint', '/admin/databasunderhall/datakvalitet-manga-punkter');
    var inputEl = document.getElementById('dbuh-input-manga-punkter');
    var minAntal = 5;
    if (inputEl) {
      var n = parseInt(inputEl.value, 10);
      if (!isNaN(n) && n >= 1) minAntal = n;
    }
    var endpoint = '/admin/databasunderhall/datakvalitet-manga-punkter?min_antal=' + minAntal;
    fetchDatakvalitet(
      endpoint,
      'Datakvalitet: Fält med ovanligt många punkter',
      'Fält som innehåller minst ' + minAntal + ' punkt(er). Grunddata har ibland linjer av små prickar som OCR tolkar som många punkter. Justera "Minst antal punkter" och kör igen för att ändra tröskel. Klicka på gravplatsen för att korrigera.',
      'Inga fält med så många punkter hittades.',
      function (gp, isHeader) {
        if (isHeader) {
          return '<tr><th scope="col">Gravplats</th><th scope="col">Roll</th><th scope="col">Fält</th><th scope="col">Antal punkter</th><th scope="col">Värde</th><th scope="col">Senast ändrad</th><th scope="col">Senast ändrad av</th></tr>';
        }
        var slug = gp.url_slug || slugFromFullstandigt(gp.fullstandigt);
        var gravLink = slug
          ? '<a href="/gravplatser/' + escapeHtml(slug) + '">' + escapeHtml(gp.fullstandigt || '–') + '</a>'
          : escapeHtml(gp.fullstandigt || '–');
        var base = '<td>' + gravLink + '</td>';
        var problemFalt = gp.problem_falt || [];
        if (problemFalt.length === 0) {
          return [ base + '<td class="dbuh-mono"></td><td class="dbuh-mono"></td><td class="dbuh-mono"></td><td class="dbuh-mono"></td>' + cellSenastAndrad(gp) ];
        }
        return problemFalt.map(function (p) {
          var antalP = p.antal_punkter != null ? p.antal_punkter : '';
          return base + '<td class="dbuh-mono">' + escapeHtml(p.roll) + '</td><td class="dbuh-mono">' + escapeHtml(p.falt) + '</td><td class="dbuh-mono">' + escapeHtml(antalP) + '</td><td class="dbuh-mono dbuh-varde">' + escapeHtml(p.varde || '') + '</td>' + cellSenastAndrad(gp);
        });
      }
    );
  });

  if (tillbakaTillMeny) {
    tillbakaTillMeny.addEventListener('click', function (e) {
      e.preventDefault();
      visaMeny();
    });
  }
})();
  </script>
</body>
</html>
