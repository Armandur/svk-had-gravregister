<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Användarhantering – Gravregister</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .admin-sida { max-width: 36rem; margin: 2rem auto; padding: 2rem; }
    .admin-sida h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    .admin-sida a { color: var(--accent, #2563eb); }
    .admin-lista { list-style: none; padding: 0; margin: 1rem 0; }
    .admin-lista li { display: flex; align-items: center; gap: 1rem; padding: 0.5rem 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; }
    .admin-lista li span { flex: 1; }
    .admin-lista .admin-namn { min-width: 8rem; }
    .admin-lista .admin-badge { font-size: 0.75rem; background: #2563eb; color: #fff; padding: 0.15rem 0.4rem; border-radius: 4px; }
    .admin-lista .admin-knappar { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .admin-lista .admin-claude-toggle { display: flex; align-items: center; gap: 0.3rem; font-size: 0.875rem; cursor: pointer; padding: 0.35rem 0.5rem; background: #f0f9ff; border: 1px solid #7dd3fc; border-radius: 4px; }
    .admin-btn { margin: 0; padding: 0.35rem 0.6rem; font-size: 0.875rem; cursor: pointer; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; color: #1e293b; font-family: inherit; text-decoration: none; display: inline-block; }
    .admin-btn:hover:not(:disabled) { background: #e2e8f0; border-color: #94a3b8; }
    .admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .admin-btn-primary { background: var(--accent, #2563eb); color: #fff; border-color: var(--accent, #2563eb); }
    .admin-btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
    .admin-btn-danger { background: none; color: #dc2626; border-color: #dc2626; }
    .admin-btn-danger:hover:not(:disabled) { background: #fee2e2; }
    .admin-inline-wrap { display: inline-flex; align-items: center; }
    .admin-inline-form { display: inline-flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; }
    .admin-inline-form[hidden] { display: none !important; }
    .admin-inline-input { padding: 0.3rem 0.5rem; font-size: 0.875rem; border: 1px solid #cbd5e1; border-radius: 4px; width: 9rem; font-family: inherit; }
    .admin-sida label { display: block; margin-top: 0.75rem; font-weight: 500; }
    .admin-sida input { padding: 0.4rem 0.5rem; margin-top: 0.25rem; width: 100%; max-width: 16rem; box-sizing: border-box; }
    .admin-sida #admin-skapa-form button { margin-top: 0.5rem; padding: 0.4rem 0.75rem; cursor: pointer; }
    .admin-fel { color: #b91c1c; font-size: 0.9rem; margin-top: 0.5rem; }
    .admin-ok { color: #16a34a; font-size: 0.9rem; margin-top: 0.5rem; }
    .admin-brodtext { font-size: 0.9rem; color: #555; margin: -0.5rem 0 0.75rem 0; }
    .admin-prefs-wrap { flex: 1 1 100%; margin-top: 0.5rem; padding: 0.75rem; background: #f8fafc; border-radius: 6px; border: 1px solid #e2e8f0; }
    .admin-prefs-wrap label { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; cursor: pointer; font-weight: normal; }
    .admin-prefs-wrap input[type="checkbox"] { margin: 0; }
    .admin-prefs-sparad { font-size: 0.85rem; color: #16a34a; margin-left: 0.5rem; }
  </style>
</head>
<body>
  <main class="admin-sida">
    <h1>Användarhantering</h1>
    <p><a href="/">← Tillbaka till menyn</a> · <a href="/prestationer">Mina prestationer</a> · <a href="/admin/achievement-niva">Prestationsgränser</a></p>
    <p id="admin-ingen">Endast administratörer kan hantera användare.</p>
    <section id="admin-innehall" hidden>
      <h2>Skapa konto</h2>
      <form id="admin-skapa-form">
        <label>Användarnamn <input type="text" id="admin-new-username" required /></label>
        <label>Lösenord <input type="password" id="admin-new-password" required /></label>
        <button type="submit">Skapa konto</button>
        <p id="admin-skapa-fel" class="admin-fel" hidden></p>
        <p id="admin-skapa-ok" class="admin-ok" hidden></p>
      </form>
      <h2>Användare</h2>
      <ul id="admin-anvandarlista" class="admin-lista"></ul>
    </section>
  </main>
  <script src="/static/utils.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    (function() {
      const innehall = document.getElementById('admin-innehall');
      const ingen = document.getElementById('admin-ingen');
      const listEl = document.getElementById('admin-anvandarlista');
      const skapaForm = document.getElementById('admin-skapa-form');
      const skapaFel = document.getElementById('admin-skapa-fel');
      const skapaOk = document.getElementById('admin-skapa-ok');
      let currentUserId = null;

      function visaAnvandare() {
        Promise.all([
          fetch('/api/me', { credentials: 'include' }).then(function(r) { return r.ok ? r.json() : null; }),
          fetch('/api/admin/users', { credentials: 'include' })
        ]).then(function([me, usersRes]) {
          if (me) currentUserId = me.id;
          if (usersRes.status === 401) {
            window.location.href = '/login?redirect=' + encodeURIComponent('/admin');
            return;
          }
          if (usersRes.status === 403) {
            ingen.hidden = false;
            innehall.hidden = true;
            return;
          }
          if (!usersRes.ok) return usersRes.json().then(function(d) { throw new Error(d.detail || 'Kunde inte hämta användare'); });
          return usersRes.json();
        })
          .then(function(data) {
            if (!data) return;
            ingen.hidden = true;
            innehall.hidden = false;
            listEl.innerHTML = '';
            (data.users || []).forEach(function(u) {
              const li = document.createElement('li');
              const isSelf = u.id === currentUserId;
              li.setAttribute('data-user-id', u.id);
              const claudeAktiv = u.claude_aktiv !== false;
              const claudeBatchAktiv = u.claude_batch_aktiv === true;
              const usernameEsc = (u.username || '').replace(/"/g, '&quot;');
              li.innerHTML = '<span class="admin-namn">' + (u.username || '') + (u.is_admin ? ' <span class="admin-badge">admin</span>' : '') + '</span>' +
                '<span class="admin-knappar">' +
                '<span class="admin-inline-wrap" id="admin-pwd-wrap-' + u.id + '">' +
                '<button type="button" class="admin-btn admin-set-pwd" data-id="' + u.id + '">Sätt lösenord</button>' +
                '<span class="admin-inline-form" id="admin-pwd-form-' + u.id + '" hidden>' +
                '<input type="password" class="admin-inline-input" id="admin-pwd-input-' + u.id + '" placeholder="Nytt lösenord" autocomplete="new-password" />' +
                '<button type="button" class="admin-btn admin-btn-primary admin-pwd-spara" data-id="' + u.id + '">Spara</button>' +
                '<button type="button" class="admin-btn admin-pwd-avbryt" data-id="' + u.id + '">Avbryt</button>' +
                '</span></span>' +
                '<span class="admin-inline-wrap" id="admin-namn-wrap-' + u.id + '">' +
                '<button type="button" class="admin-btn admin-byta-namn" data-id="' + u.id + '" data-username="' + usernameEsc + '">Byt namn</button>' +
                '<span class="admin-inline-form" id="admin-namn-form-' + u.id + '" hidden>' +
                '<input type="text" class="admin-inline-input" id="admin-namn-input-' + u.id + '" value="' + usernameEsc + '" autocomplete="off" />' +
                '<button type="button" class="admin-btn admin-btn-primary admin-namn-spara" data-id="' + u.id + '" data-username="' + usernameEsc + '">Spara</button>' +
                '<button type="button" class="admin-btn admin-namn-avbryt" data-id="' + u.id + '">Avbryt</button>' +
                '</span></span>' +
                '<a href="/admin/users/' + u.id + '/prestationer" class="admin-btn">Prestationer</a>' +
                '<button type="button" class="admin-btn admin-roliga-saker" data-id="' + u.id + '">Preferenser</button>' +
                '<label class="admin-claude-toggle" title="Aktivera/inaktivera Claude OCR för denna användare"><input type="checkbox" class="admin-claude-aktiv" data-id="' + u.id + '"' + (claudeAktiv ? ' checked' : '') + ' /> Claude</label>' +
                '<label class="admin-claude-toggle" title="Aktivera/inaktivera Claude Batch OCR för denna användare"><input type="checkbox" class="admin-claude-batch-aktiv" data-id="' + u.id + '"' + (claudeBatchAktiv ? ' checked' : '') + ' /> Batch</label>' +
                '<button type="button" class="admin-btn admin-btn-danger admin-ta-bort" data-id="' + u.id + '" data-username="' + usernameEsc + '"' + (isSelf ? ' disabled title="Du kan inte ta bort ditt eget konto"' : '') + '>Ta bort</button>' +
                '</span>' +
                '<div class="admin-prefs-wrap" id="admin-prefs-' + u.id + '" hidden>' +
                '<label><input type="checkbox" id="admin-pref-fun-' + u.id + '" /> Aktivera utmärkelse-notifieringar (toast och ljud)</label>' +
                '<label><input type="checkbox" id="admin-pref-toast-' + u.id + '" /> Visa toast (nytt yrke och utmärkelser)</label>' +
                '<label><input type="checkbox" id="admin-pref-sound-' + u.id + '" /> Spela ljud (nytt yrke och utmärkelser)</label>' +
                '<br /><button type="button" class="admin-btn admin-btn-primary admin-prefs-spara" data-id="' + u.id + '">Spara</button><span class="admin-prefs-sparad" id="admin-prefs-sparad-' + u.id + '" hidden>Sparat.</span>' +
                '</div>';
              listEl.appendChild(li);
            });
            // --- Inline lösenordsformulär ---
            listEl.querySelectorAll('.admin-set-pwd').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                btn.hidden = true;
                const form = document.getElementById('admin-pwd-form-' + id);
                if (form) { form.hidden = false; const inp = document.getElementById('admin-pwd-input-' + id); if (inp) { inp.value = ''; inp.focus(); } }
              });
            });
            listEl.querySelectorAll('.admin-pwd-avbryt').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                const form = document.getElementById('admin-pwd-form-' + id);
                if (form) form.hidden = true;
                const setPwdBtn = listEl.querySelector('.admin-set-pwd[data-id="' + id + '"]');
                if (setPwdBtn) setPwdBtn.hidden = false;
              });
            });
            listEl.querySelectorAll('.admin-pwd-spara').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                const inp = document.getElementById('admin-pwd-input-' + id);
                const pwd = inp ? inp.value.trim() : '';
                if (!pwd) { showToast('Ange ett lösenord.', 'info'); if (inp) inp.focus(); return; }
                btn.disabled = true;
                fetch('/api/admin/users/' + id + '/password', {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ password: pwd }),
                  credentials: 'include'
                }).then(function(r) {
                  if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Kunde inte spara'); });
                  showToast('Lösenord uppdaterat.', 'ok');
                  const form = document.getElementById('admin-pwd-form-' + id);
                  if (form) form.hidden = true;
                  const setPwdBtn = listEl.querySelector('.admin-set-pwd[data-id="' + id + '"]');
                  if (setPwdBtn) setPwdBtn.hidden = false;
                }).catch(function(e) {
                  showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
                }).finally(function() { btn.disabled = false; });
              });
            });

            // --- Inline namnformulär ---
            listEl.querySelectorAll('.admin-byta-namn').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                btn.hidden = true;
                const form = document.getElementById('admin-namn-form-' + id);
                if (form) { form.hidden = false; const inp = document.getElementById('admin-namn-input-' + id); if (inp) { inp.select(); inp.focus(); } }
              });
            });
            listEl.querySelectorAll('.admin-namn-avbryt').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                const form = document.getElementById('admin-namn-form-' + id);
                if (form) form.hidden = true;
                const namnBtn = listEl.querySelector('.admin-byta-namn[data-id="' + id + '"]');
                if (namnBtn) namnBtn.hidden = false;
              });
            });
            listEl.querySelectorAll('.admin-namn-spara').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                const gammalt = (btn.dataset.username || '').trim();
                const inp = document.getElementById('admin-namn-input-' + id);
                const trimmed = inp ? (inp.value || '').trim() : '';
                if (!trimmed) { showToast('Användarnamn kan inte vara tomt.', 'info'); if (inp) inp.focus(); return; }
                if (trimmed === gammalt) {
                  const form = document.getElementById('admin-namn-form-' + id);
                  if (form) form.hidden = true;
                  const namnBtn = listEl.querySelector('.admin-byta-namn[data-id="' + id + '"]');
                  if (namnBtn) namnBtn.hidden = false;
                  return;
                }
                btn.disabled = true;
                fetch('/api/admin/users/' + id, {
                  method: 'PATCH',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ username: trimmed }),
                  credentials: 'include'
                }).then(function(r) {
                  return r.json().then(function(d) {
                    if (!r.ok) throw new Error(d.detail || 'Kunde inte byta namn');
                    showToast('Användarnamn uppdaterat till: ' + (d.username || trimmed), 'ok');
                    visaAnvandare();
                  });
                }).catch(function(e) {
                  showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
                }).finally(function() { btn.disabled = false; });
              });
            });
            listEl.querySelectorAll('.admin-claude-aktiv').forEach(function(cb) {
              cb.addEventListener('change', function() {
                const id = cb.dataset.id;
                const aktiv = cb.checked;
                fetch('/api/admin/users/' + id + '/claude-aktiv', {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ aktiv: aktiv }),
                  credentials: 'include',
                }).then(function(r) {
                  if (!r.ok) { cb.checked = !aktiv; showToast('Kunde inte ändra Claude-status.', 'fel'); }
                }).catch(function() { cb.checked = !aktiv; });
              });
            });
            listEl.querySelectorAll('.admin-claude-batch-aktiv').forEach(function(cb) {
              cb.addEventListener('change', function() {
                const id = cb.dataset.id;
                const aktiv = cb.checked;
                fetch('/api/admin/users/' + id + '/claude-batch-aktiv', {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ aktiv: aktiv }),
                  credentials: 'include',
                }).then(function(r) {
                  if (!r.ok) { cb.checked = !aktiv; showToast('Kunde inte ändra Batch-status.', 'fel'); }
                }).catch(function() { cb.checked = !aktiv; });
              });
            });
            listEl.querySelectorAll('.admin-ta-bort:not([disabled])').forEach(function(btn) {
              btn.addEventListener('click', async function() {
                const id = btn.dataset.id;
                const username = (btn.dataset.username || '').trim();
                if (!await showConfirm('Vill du verkligen ta bort användaren "' + username + '"? Detta kan inte ångras.')) return;
                fetch('/api/admin/users/' + id, {
                  method: 'DELETE',
                  credentials: 'include'
                }).then(function(r) {
                  if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Kunde inte ta bort'); });
                  showToast('Användaren borttagen.', 'ok');
                  visaAnvandare();
                }).catch(function(e) {
                  showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
                });
              });
            });
            listEl.querySelectorAll('.admin-roliga-saker').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                const wrap = document.getElementById('admin-prefs-' + id);
                if (!wrap) return;
                if (wrap.hidden) {
                  wrap.hidden = false;
                  fetch('/api/admin/users/' + id + '/preferences', { credentials: 'include' })
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(data) {
                      if (!data || !data.preferences) return;
                      const p = data.preferences;
                      const funEl = document.getElementById('admin-pref-fun-' + id);
                      const toastEl = document.getElementById('admin-pref-toast-' + id);
                      const soundEl = document.getElementById('admin-pref-sound-' + id);
                      if (funEl) funEl.checked = p.fun_enabled !== false;
                      if (toastEl) toastEl.checked = p.toast_on_new_yrke !== false;
                      if (soundEl) soundEl.checked = p.sound_on_new_yrke !== false;
                    })
                    .catch(function() {});
                } else {
                  wrap.hidden = true;
                }
              });
            });
            listEl.querySelectorAll('.admin-prefs-spara').forEach(function(btn) {
              btn.addEventListener('click', function() {
                const id = btn.dataset.id;
                const funEl = document.getElementById('admin-pref-fun-' + id);
                const toastEl = document.getElementById('admin-pref-toast-' + id);
                const soundEl = document.getElementById('admin-pref-sound-' + id);
                const sparadEl = document.getElementById('admin-prefs-sparad-' + id);
                const body = {
                  fun_enabled: funEl ? funEl.checked : true,
                  toast_on_new_yrke: toastEl ? toastEl.checked : true,
                  sound_on_new_yrke: soundEl ? soundEl.checked : true
                };
                fetch('/api/admin/users/' + id + '/preferences', {
                  method: 'PATCH',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                  credentials: 'include'
                }).then(function(r) {
                  if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Kunde inte spara'); });
                  if (sparadEl) {
                    sparadEl.hidden = false;
                    setTimeout(function() { sparadEl.hidden = true; }, 2500);
                  }
                }).catch(function(e) {
                  showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
                });
              });
            });
          })
          .catch(function(e) {
            ingen.textContent = e.message || 'Ett fel uppstod';
            ingen.hidden = false;
          });
      }

      gpEnsureAuth().then(function(ok) {
        if (!ok) return;
        visaAnvandare();
      });

      skapaForm.addEventListener('submit', function(e) {
        e.preventDefault();
        skapaFel.hidden = true;
        skapaOk.hidden = true;
        const username = document.getElementById('admin-new-username').value.trim();
        const password = document.getElementById('admin-new-password').value;
        if (!username || !password) {
          skapaFel.textContent = 'Ange användarnamn och lösenord.';
          skapaFel.hidden = false;
          return;
        }
        fetch('/api/admin/users/new', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include'
        }).then(function(r) {
          return r.json().then(function(d) {
            if (!r.ok) throw new Error(d.detail || 'Kunde inte skapa konto');
            skapaOk.textContent = 'Konto skapat: ' + (d.username || username);
            skapaOk.hidden = false;
            document.getElementById('admin-new-username').value = '';
            document.getElementById('admin-new-password').value = '';
            visaAnvandare();
          });
        }).catch(function(e) {
          skapaFel.textContent = e.message || 'Nätverksfel';
          skapaFel.hidden = false;
        });
      });
    })();
  </script>
</body>
</html>
