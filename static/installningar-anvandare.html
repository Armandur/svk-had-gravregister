<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Användarhantering – Gravregister</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .admin-sida { max-width: 64rem; margin: 2rem auto; padding: 2rem; }
    .admin-sida h1 { font-size: 1.25rem; margin-bottom: 1rem; }
    .admin-sida h2 { font-size: 1rem; margin: 1.5rem 0 0.75rem; }
    .admin-sida a { color: var(--accent, #2563eb); }

    /* Skapa-formulär */
    .admin-skapa-rad { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; }
    .admin-skapa-rad label { display: flex; flex-direction: column; gap: 0.25rem; font-weight: 500; font-size: 0.9rem; }
    .admin-skapa-rad input { padding: 0.4rem 0.5rem; border: 1px solid #cbd5e1; border-radius: 4px; font-family: inherit; font-size: 0.9rem; width: 14rem; box-sizing: border-box; }
    .admin-fel { color: #b91c1c; font-size: 0.9rem; margin-top: 0.5rem; }
    .admin-ok  { color: #16a34a; font-size: 0.9rem; margin-top: 0.5rem; }

    /* Tabell */
    .admin-tabell { width: 100%; border-collapse: collapse; margin-top: 0.25rem; font-size: 0.9rem; }
    .admin-tabell th { text-align: left; padding: 0.5rem 0.75rem; background: #f1f5f9; border-bottom: 2px solid #e2e8f0; font-weight: 600; white-space: nowrap; }
    .admin-tabell td { padding: 0.5rem 0.75rem; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
    .admin-tabell tbody tr:last-child td { border-bottom: none; }
    .admin-tabell tr.admin-expanderbar { background: #f8fafc; }
    .admin-tabell tr.admin-expanderbar td { padding: 0.6rem 1rem 0.75rem; }
    .admin-tabell tr.admin-expanderbar[hidden] { display: none; }

    /* Knappar */
    .admin-btn { margin: 0; padding: 0.3rem 0.6rem; font-size: 0.85rem; cursor: pointer; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 4px; color: #1e293b; font-family: inherit; text-decoration: none; display: inline-block; white-space: nowrap; line-height: 1.4; }
    .admin-btn:hover:not(:disabled) { background: #e2e8f0; border-color: #94a3b8; }
    .admin-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .admin-btn-primary { background: var(--accent, #2563eb); color: #fff; border-color: var(--accent, #2563eb); }
    .admin-btn-primary:hover:not(:disabled) { filter: brightness(1.1); }
    .admin-btn-danger { background: none; color: #dc2626; border-color: #dc2626; }
    .admin-btn-danger:hover:not(:disabled) { background: #fee2e2; }
    .admin-knappar { display: flex; gap: 0.4rem; flex-wrap: nowrap; align-items: center; }

    /* Badges och toggles */
    .admin-badge { font-size: 0.7rem; background: #2563eb; color: #fff; padding: 0.1rem 0.4rem; border-radius: 4px; vertical-align: middle; margin-left: 0.3rem; }
    .admin-claude-toggle { display: flex; align-items: center; justify-content: center; }
    .admin-claude-toggle input[type="checkbox"] { cursor: pointer; width: 1rem; height: 1rem; }

    /* Inline-formulär (expanderbara rader) */
    .admin-inline-form { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .admin-inline-form label { font-size: 0.875rem; font-weight: 500; }
    .admin-inline-input { padding: 0.3rem 0.5rem; font-size: 0.875rem; border: 1px solid #cbd5e1; border-radius: 4px; width: 13rem; font-family: inherit; }

    /* Preferenser */
    .admin-prefs-wrap { display: flex; flex-direction: column; gap: 0.3rem; }
    .admin-prefs-wrap label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.875rem; font-weight: normal; }
    .admin-prefs-wrap input[type="checkbox"] { margin: 0; cursor: pointer; }
    .admin-prefs-knappar { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .admin-prefs-sparad { font-size: 0.85rem; color: #16a34a; }
  </style>
</head>
<body>
  <main class="admin-sida">
    <h1>Användarhantering</h1>
    <p><a href="/">← Tillbaka till menyn</a> · <a href="/installningar">Inställningar</a></p>
    <p id="admin-ingen">Endast administratörer kan hantera användare.</p>
    <section id="admin-innehall" hidden>
      <h2>Skapa konto</h2>
      <form id="admin-skapa-form">
        <div class="admin-skapa-rad">
          <label>Användarnamn
            <input type="text" id="admin-new-username" required autocomplete="off" />
          </label>
          <label>Lösenord
            <input type="password" id="admin-new-password" required autocomplete="new-password" />
          </label>
          <button type="submit" class="admin-btn admin-btn-primary">Skapa konto</button>
        </div>
        <p id="admin-skapa-fel" class="admin-fel" hidden></p>
        <p id="admin-skapa-ok"  class="admin-ok"  hidden></p>
      </form>

      <h2>Användare</h2>
      <table class="admin-tabell">
        <thead>
          <tr>
            <th>Användarnamn</th>
            <th style="text-align:center">Claude</th>
            <th style="text-align:center">Batch</th>
            <th>Åtgärder</th>
          </tr>
        </thead>
        <tbody id="admin-anvandarlista"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/utils.js"></script>
  <script src="/static/auth.js"></script>
  <script>
    (function() {
      const innehall  = document.getElementById('admin-innehall');
      const ingen     = document.getElementById('admin-ingen');
      const tbody     = document.getElementById('admin-anvandarlista');
      const skapaForm = document.getElementById('admin-skapa-form');
      const skapaFel  = document.getElementById('admin-skapa-fel');
      const skapaOk   = document.getElementById('admin-skapa-ok');
      let currentUserId = null;

      function escape(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      function visaAnvandare() {
        Promise.all([
          fetch('/api/me', { credentials: 'include' }).then(function(r) { return r.ok ? r.json() : null; }),
          fetch('/api/admin/users', { credentials: 'include' })
        ]).then(function([me, usersRes]) {
          if (me) currentUserId = me.id;
          if (usersRes.status === 401) { window.location.href = '/login?redirect=' + encodeURIComponent('/installningar/anvandare'); return; }
          if (usersRes.status === 403) { ingen.hidden = false; innehall.hidden = true; return; }
          if (!usersRes.ok) return usersRes.json().then(function(d) { throw new Error(d.detail || 'Kunde inte hämta användare'); });
          return usersRes.json();
        }).then(function(data) {
          if (!data) return;
          ingen.hidden = true;
          innehall.hidden = false;
          tbody.innerHTML = '';

          (data.users || []).forEach(function(u) {
            const isSelf       = u.id === currentUserId;
            const claudeAktiv  = u.claude_aktiv !== false;
            const batchAktiv   = u.claude_batch_aktiv === true;
            const uEsc         = escape(u.username);

            // --- Huvudrad ---
            const trMain = document.createElement('tr');
            trMain.setAttribute('data-user-id', u.id);
            trMain.innerHTML =
              '<td>' + uEsc + (u.is_admin ? ' <span class="admin-badge">admin</span>' : '') + '</td>' +
              '<td style="text-align:center"><label class="admin-claude-toggle" title="Claude OCR"><input type="checkbox" class="admin-claude-aktiv" data-id="' + u.id + '"' + (claudeAktiv ? ' checked' : '') + ' /></label></td>' +
              '<td style="text-align:center"><label class="admin-claude-toggle" title="Claude Batch OCR"><input type="checkbox" class="admin-claude-batch-aktiv" data-id="' + u.id + '"' + (batchAktiv ? ' checked' : '') + ' /></label></td>' +
              '<td><div class="admin-knappar">' +
                '<button type="button" class="admin-btn admin-set-pwd" data-id="' + u.id + '">Sätt lösenord</button>' +
                '<button type="button" class="admin-btn admin-byta-namn" data-id="' + u.id + '" data-username="' + uEsc + '">Byt namn</button>' +
                '<a href="/installningar/anvandare/' + u.id + '/prestationer" class="admin-btn">Prestationer</a>' +
                '<button type="button" class="admin-btn admin-roliga-saker" data-id="' + u.id + '">Preferenser</button>' +
                '<button type="button" class="admin-btn admin-btn-danger admin-ta-bort" data-id="' + u.id + '" data-username="' + uEsc + '"' + (isSelf ? ' disabled title="Du kan inte ta bort ditt eget konto"' : '') + '>Ta bort</button>' +
              '</div></td>';
            tbody.appendChild(trMain);

            // --- Lösenordsrad ---
            const trPwd = document.createElement('tr');
            trPwd.className = 'admin-expanderbar';
            trPwd.id = 'admin-pwd-row-' + u.id;
            trPwd.hidden = true;
            trPwd.innerHTML =
              '<td colspan="4"><div class="admin-inline-form">' +
                '<label for="admin-pwd-input-' + u.id + '">Nytt lösenord:</label>' +
                '<input type="password" class="admin-inline-input" id="admin-pwd-input-' + u.id + '" placeholder="Skriv nytt lösenord…" autocomplete="new-password" />' +
                '<button type="button" class="admin-btn admin-btn-primary admin-pwd-spara" data-id="' + u.id + '">Spara</button>' +
                '<button type="button" class="admin-btn admin-pwd-avbryt" data-id="' + u.id + '">Avbryt</button>' +
              '</div></td>';
            tbody.appendChild(trPwd);

            // --- Namnrad ---
            const trNamn = document.createElement('tr');
            trNamn.className = 'admin-expanderbar';
            trNamn.id = 'admin-namn-row-' + u.id;
            trNamn.hidden = true;
            trNamn.innerHTML =
              '<td colspan="4"><div class="admin-inline-form">' +
                '<label for="admin-namn-input-' + u.id + '">Nytt namn:</label>' +
                '<input type="text" class="admin-inline-input" id="admin-namn-input-' + u.id + '" value="' + uEsc + '" autocomplete="off" />' +
                '<button type="button" class="admin-btn admin-btn-primary admin-namn-spara" data-id="' + u.id + '" data-username="' + uEsc + '">Spara</button>' +
                '<button type="button" class="admin-btn admin-namn-avbryt" data-id="' + u.id + '">Avbryt</button>' +
              '</div></td>';
            tbody.appendChild(trNamn);

            // --- Preferensrad ---
            const trPrefs = document.createElement('tr');
            trPrefs.className = 'admin-expanderbar';
            trPrefs.id = 'admin-prefs-row-' + u.id;
            trPrefs.hidden = true;
            trPrefs.innerHTML =
              '<td colspan="4"><div class="admin-prefs-wrap">' +
                '<label><input type="checkbox" id="admin-pref-fun-' + u.id + '" /> Aktivera utmärkelse-notifieringar (toast och ljud)</label>' +
                '<label><input type="checkbox" id="admin-pref-toast-' + u.id + '" /> Visa toast (nytt yrke och utmärkelser)</label>' +
                '<label><input type="checkbox" id="admin-pref-sound-' + u.id + '" /> Spela ljud (nytt yrke och utmärkelser)</label>' +
                '<div class="admin-prefs-knappar">' +
                  '<button type="button" class="admin-btn admin-btn-primary admin-prefs-spara" data-id="' + u.id + '">Spara</button>' +
                  '<span class="admin-prefs-sparad" id="admin-prefs-sparad-' + u.id + '" hidden>Sparat.</span>' +
                '</div>' +
              '</div></td>';
            tbody.appendChild(trPrefs);
          });

          // --- Händelselyssnare ---

          tbody.querySelectorAll('.admin-set-pwd').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const id = btn.dataset.id;
              const row = document.getElementById('admin-pwd-row-' + id);
              if (!row) return;
              const wasHidden = row.hidden;
              document.getElementById('admin-namn-row-' + id).hidden = true;
              row.hidden = !wasHidden;
              if (!row.hidden) { const inp = document.getElementById('admin-pwd-input-' + id); if (inp) { inp.value = ''; inp.focus(); } }
            });
          });

          tbody.querySelectorAll('.admin-pwd-avbryt').forEach(function(btn) {
            btn.addEventListener('click', function() {
              document.getElementById('admin-pwd-row-' + btn.dataset.id).hidden = true;
            });
          });

          tbody.querySelectorAll('.admin-pwd-spara').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const id  = btn.dataset.id;
              const inp = document.getElementById('admin-pwd-input-' + id);
              const pwd = inp ? inp.value.trim() : '';
              if (!pwd) { showToast('Ange ett lösenord.', 'info'); if (inp) inp.focus(); return; }
              btn.disabled = true;
              fetch('/api/admin/users/' + id + '/password', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pwd }),
                credentials: 'include'
              }).then(function(r) {
                if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Kunde inte spara'); });
                showToast('Lösenord uppdaterat.', 'ok');
                document.getElementById('admin-pwd-row-' + id).hidden = true;
              }).catch(function(e) {
                showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
              }).finally(function() { btn.disabled = false; });
            });
          });

          tbody.querySelectorAll('.admin-byta-namn').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const id = btn.dataset.id;
              const row = document.getElementById('admin-namn-row-' + id);
              if (!row) return;
              const wasHidden = row.hidden;
              document.getElementById('admin-pwd-row-' + id).hidden = true;
              row.hidden = !wasHidden;
              if (!row.hidden) { const inp = document.getElementById('admin-namn-input-' + id); if (inp) { inp.select(); inp.focus(); } }
            });
          });

          tbody.querySelectorAll('.admin-namn-avbryt').forEach(function(btn) {
            btn.addEventListener('click', function() {
              document.getElementById('admin-namn-row-' + btn.dataset.id).hidden = true;
            });
          });

          tbody.querySelectorAll('.admin-namn-spara').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const id      = btn.dataset.id;
              const gammalt = (btn.dataset.username || '').trim();
              const inp     = document.getElementById('admin-namn-input-' + id);
              const trimmed = inp ? (inp.value || '').trim() : '';
              if (!trimmed) { showToast('Användarnamn kan inte vara tomt.', 'info'); if (inp) inp.focus(); return; }
              if (trimmed === gammalt) { document.getElementById('admin-namn-row-' + id).hidden = true; return; }
              btn.disabled = true;
              fetch('/api/admin/users/' + id, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: trimmed }),
                credentials: 'include'
              }).then(function(r) {
                return r.json().then(function(d) {
                  if (!r.ok) throw new Error(d.detail || 'Kunde inte byta namn');
                  showToast('Användarnamn uppdaterat till: ' + (d.username || trimmed), 'ok');
                  visaAnvandare();
                });
              }).catch(function(e) {
                showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
              }).finally(function() { btn.disabled = false; });
            });
          });

          tbody.querySelectorAll('.admin-claude-aktiv').forEach(function(cb) {
            cb.addEventListener('change', function() {
              const id    = cb.dataset.id;
              const aktiv = cb.checked;
              fetch('/api/admin/users/' + id + '/claude-aktiv', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ aktiv: aktiv }),
                credentials: 'include'
              }).then(function(r) {
                if (!r.ok) { cb.checked = !aktiv; showToast('Kunde inte ändra Claude-status.', 'fel'); }
              }).catch(function() { cb.checked = !aktiv; });
            });
          });

          tbody.querySelectorAll('.admin-claude-batch-aktiv').forEach(function(cb) {
            cb.addEventListener('change', function() {
              const id    = cb.dataset.id;
              const aktiv = cb.checked;
              fetch('/api/admin/users/' + id + '/claude-batch-aktiv', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ aktiv: aktiv }),
                credentials: 'include'
              }).then(function(r) {
                if (!r.ok) { cb.checked = !aktiv; showToast('Kunde inte ändra Batch-status.', 'fel'); }
              }).catch(function() { cb.checked = !aktiv; });
            });
          });

          tbody.querySelectorAll('.admin-ta-bort:not([disabled])').forEach(function(btn) {
            btn.addEventListener('click', async function() {
              const id       = btn.dataset.id;
              const username = (btn.dataset.username || '').trim();
              if (!await showConfirm('Vill du verkligen ta bort användaren "' + username + '"? Detta kan inte ångras.')) return;
              fetch('/api/admin/users/' + id, {
                method: 'DELETE',
                credentials: 'include'
              }).then(function(r) {
                if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Kunde inte ta bort'); });
                showToast('Användaren borttagen.', 'ok');
                visaAnvandare();
              }).catch(function(e) {
                showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
              });
            });
          });

          tbody.querySelectorAll('.admin-roliga-saker').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const id  = btn.dataset.id;
              const row = document.getElementById('admin-prefs-row-' + id);
              if (!row) return;
              if (row.hidden) {
                row.hidden = false;
                fetch('/api/admin/users/' + id + '/preferences', { credentials: 'include' })
                  .then(function(r) { return r.ok ? r.json() : null; })
                  .then(function(data) {
                    if (!data || !data.preferences) return;
                    const p = data.preferences;
                    const funEl   = document.getElementById('admin-pref-fun-'   + id);
                    const toastEl = document.getElementById('admin-pref-toast-' + id);
                    const soundEl = document.getElementById('admin-pref-sound-' + id);
                    if (funEl)   funEl.checked   = p.fun_enabled !== false;
                    if (toastEl) toastEl.checked = p.toast_on_new_yrke !== false;
                    if (soundEl) soundEl.checked = p.sound_on_new_yrke !== false;
                  })
                  .catch(function() {});
              } else {
                row.hidden = true;
              }
            });
          });

          tbody.querySelectorAll('.admin-prefs-spara').forEach(function(btn) {
            btn.addEventListener('click', function() {
              const id      = btn.dataset.id;
              const funEl   = document.getElementById('admin-pref-fun-'   + id);
              const toastEl = document.getElementById('admin-pref-toast-' + id);
              const soundEl = document.getElementById('admin-pref-sound-' + id);
              const sparadEl = document.getElementById('admin-prefs-sparad-' + id);
              fetch('/api/admin/users/' + id + '/preferences', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  fun_enabled:       funEl   ? funEl.checked   : true,
                  toast_on_new_yrke: toastEl ? toastEl.checked : true,
                  sound_on_new_yrke: soundEl ? soundEl.checked : true
                }),
                credentials: 'include'
              }).then(function(r) {
                if (!r.ok) return r.json().then(function(d) { throw new Error(d.detail || 'Kunde inte spara'); });
                if (sparadEl) { sparadEl.hidden = false; setTimeout(function() { sparadEl.hidden = true; }, 2500); }
              }).catch(function(e) {
                showToast('Fel: ' + (e.message || 'nätverksfel'), 'fel');
              });
            });
          });
        }).catch(function(e) {
          ingen.textContent = e.message || 'Ett fel uppstod';
          ingen.hidden = false;
        });
      }

      gpEnsureAuth().then(function(ok) {
        if (!ok) return;
        visaAnvandare();
      });

      skapaForm.addEventListener('submit', function(e) {
        e.preventDefault();
        skapaFel.hidden = true;
        skapaOk.hidden  = true;
        const username = document.getElementById('admin-new-username').value.trim();
        const password = document.getElementById('admin-new-password').value;
        if (!username || !password) {
          skapaFel.textContent = 'Ange användarnamn och lösenord.';
          skapaFel.hidden = false;
          return;
        }
        fetch('/api/admin/users/new', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include'
        }).then(function(r) {
          return r.json().then(function(d) {
            if (!r.ok) throw new Error(d.detail || 'Kunde inte skapa konto');
            skapaOk.textContent = 'Konto skapat: ' + (d.username || username);
            skapaOk.hidden = false;
            document.getElementById('admin-new-username').value = '';
            document.getElementById('admin-new-password').value = '';
            visaAnvandare();
          });
        }).catch(function(e) {
          skapaFel.textContent = e.message || 'Nätverksfel';
          skapaFel.hidden = false;
        });
      });
    })();
  </script>
</body>
</html>
