<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grunddatahantering – Gravregister</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .gd-sida { max-width: 40rem; margin: 2rem auto; padding: 2rem; }
    .gd-sida h1 { font-size: 1.35rem; margin-bottom: 1rem; color: var(--accent, #2563eb); }
    .gd-meny { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.25rem; }
    .gd-meny a {
      display: block;
      width: 100%;
      padding: 1rem 1.25rem;
      font-size: 1.05rem;
      text-align: center;
      text-decoration: none;
      color: #1e293b;
      background: var(--card, #fff);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: background 0.15s, border-color 0.15s;
    }
    .gd-meny a:hover {
      background: #f8fafc;
      border-color: var(--accent, #2563eb);
      color: var(--accent, #2563eb);
    }
    .gd-meny a:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .gd-tillbaka { margin-bottom: 1rem; }
    .gd-tillbaka a { color: var(--accent); text-decoration: none; }
    .gd-tillbaka a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="gd-sida">
    <h1>Grunddatahantering</h1>
    <p class="gd-tillbaka"><a href="/">← Tillbaka till menyn</a></p>
    <nav class="gd-meny" aria-label="Grunddatahantering">
      <a href="/listvy">Ange gravplatser (listvy)</a>
      <a href="/grunddata/kyrkogardar">Hantera kyrkogårdar</a>
    </nav>
  </main>
  <script src="/static/auth.js"></script>
  <script>
    gpEnsureAuth().then(function(ok) {
      if (!ok) return;
      fetch('/api/me', { credentials: 'include' }).then(function(r) {
        if (r.status === 401) window.location.href = '/login?redirect=' + encodeURIComponent('/grunddata');
        if (r.ok) return r.json();
      }).then(function(me) {
        if (me && !me.is_admin) window.location.href = '/';
      });
    });
  </script>
</body>
</html>
