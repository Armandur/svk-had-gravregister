<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gravregister – startsida</title>
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    .startsida { max-width: 32rem; margin: 3rem auto; padding: 2rem; }
    .startsida h1 { margin-bottom: 1.5rem; font-size: 1.5rem; color: var(--accent, #2563eb); }
    .startsida-meny { display: flex; flex-direction: column; gap: 1rem; }
    .startsida-meny a { display: block; padding: 1rem 1.25rem; font-size: 1.05rem; text-align: center; text-decoration: none; color: #1e293b; background: var(--card, #fff); border: 1px solid var(--border, #e2e8f0); border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: background 0.15s, border-color 0.15s; }
    .startsida-meny a:hover { background: #f8fafc; border-color: var(--accent, #2563eb); color: var(--accent, #2563eb); }
    .startsida-meny a:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="startsida">
    <h1>Gravregister</h1>
    <nav class="startsida-meny" aria-label="Huvudmeny">
      <a href="/listvy">PDF-listvy</a>
      <a href="/gravplatser">Gravregister – Visa och Inmatning</a>
    </nav>
  </main>
</body>
</html>
